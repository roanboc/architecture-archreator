# The documentation portal — the model as a website, for readers who will
# never clone the repository.
#
# The Markdown under `architecture/` stays the source of truth. Nothing here
# renders anything that is not in it, and everything the build produces lands
# in `.docs/`, which is gitignored: delete it and nothing is lost.
#
# `scripts/build_docs.py` is what you run. It stages the documents into
# `.docs/src/`, keeping every repository path so the portal's "edit this page"
# links land on the real file in git, and then calls MkDocs with this file.
# The same staging runs again before every rebuild, through the hook below, so
# `--serve` picks up an edit to `architecture/` rather than serving a snapshot.
#
# This repository holds several models, one per tree, and each tree has its
# own copy of this file. What they share sits at the repository root: one
# `scripts/` and one `overrides/`, pointed at from here rather than copied
# three times.
#
# Build this tree with `python3 scripts/build_docs.py --project org-archreator`.

site_name: "The archreator organization — architecture"
site_description: >-
  The architecture model of the organization that publishes archreator: who it serves, what it must be able to do, and the courses of action it has taken.

# The pencil on every page opens that file in git. `edit_uri` carries the
# tree's own path, because a staged document's path is relative to the tree
# and the repository holds three of them.
repo_url: https://github.com/roanboc/architecture-archreator
repo_name: roanboc/architecture-archreator
edit_uri: edit/main/org-archreator/

# Both are derived. `src/` is the staged copy of the Markdown, `site/` is the
# built portal, and `scripts/build_docs.py` writes them. MkDocs checks that
# `docs_dir` exists before it loads the hook below, so on a fresh clone run
# that script once; `mkdocs` on its own works from then on.
docs_dir: .docs/src
site_dir: .docs/site

# Every page is a real `.html` file, so the built folder opens by
# double-clicking it and survives being zipped, put on a shared drive or
# served by anything at all. The alternative — MkDocs' default — is prettier
# URLs on a web server and a folder that only works on one. Set it to `true`
# if this portal will only ever be hosted.
use_directory_urls: false

# Staging, re-run before every build. It is what makes `mkdocs serve` and
# `mkdocs build` work when called directly, by a CI action or by hand.
hooks:
  - ../scripts/build_docs.py

theme:
  name: material
  custom_dir: ../overrides
  language: en
  icon:
    repo: fontawesome/brands/git-alt
  features:
    - content.action.edit      # the pencil: read a page, fix its source
    - content.code.copy
    - navigation.indexes       # a folder's README is the folder's own page
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# TEMPLATE — comment threads under every page, off until these are filled in.
# The four values come from giscus.app, which generates them once the
# repository is public, has Discussions enabled and has the giscus app
# installed. Readers comment with a GitHub account, and the threads are
# GitHub Discussions — see `overrides/partials/comments.html`, and decide
# deliberately: a thread is a conversation about a document, never the
# document.
# extra:
#   giscus:
#     repo: <org>/<project>
#     repo_id: <from giscus.app>
#     category: Architecture
#     category_id: <from giscus.app>
#     heading: Discussion

# A PDF for a particular audience is a second config file beside this one,
# inheriting it and changing only what that audience does not need:
#
#   # mkdocs-board.yml
#   INHERIT: mkdocs.yml
#   plugins:
#     print-site:
#       exclude:
#         - architecture/scope/*
#         - architecture/5_technology/*
#
# then `python3 scripts/export_pdf.py --config mkdocs-board.yml`, which writes
# `.docs/architecture-board.pdf` and leaves the portal alone.

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # ArchiMate-on-Mermaid is the notation the whole model is drawn in, so a
  # portal that does not render Mermaid renders nothing worth publishing.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Written as a mapping rather than a list so that a second config file can
# inherit this one and override a single option — which is how an audience
# gets its own PDF, below.
plugins:
  search: {}
  # The whole model as one page, which is also what the PDF is rendered from
  # — see `scripts/export_pdf.py`. Kept out of the navigation because it is a
  # second copy of every page; readers reach it from the link the theme
  # override puts at the foot of every page, or at print_page.html directly.
  print-site:
    add_to_navigation: false
    add_print_site_banner: false
    add_cover_page: true
    # **The PDF says what it is on its own cover.** A generated document that
    # does not announce itself gets mailed around and quoted long after it
    # stopped being true, which is `RULE7` — a rendering is never the model —
    # failing in the one place nobody can see it fail. Same reason a brief
    # carries the same line.
    cover_page_template: "../overrides/pdf-cover.tpl"
    add_table_of_contents: true
    enumerate_headings: false
    enumerate_figures: false
    print_page_title: "The whole model"
    # Documents the PDF leaves out. They stay in the portal — this is about
    # what belongs in a document handed to someone, not about hiding a page.
    # Paths are globs, relative to the project root, e.g.
    #   - architecture/scope/*
    #   - architecture/decisions/*
    exclude: []
